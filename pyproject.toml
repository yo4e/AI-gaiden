[project]
name = "ai-gaiden-news-pipeline"
version = "0.1.0"
description = "Official RSS/Atom ingestion and Japanese digest generation for AI外電"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", "dist", ".astro"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
