name: Daily official AI news

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      bootstrap_days:
        description: 初回または再取得する日数（最大7）
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.cache/argos/packages
      ARGOS_AUTO_INSTALL: '1'
      BOOTSTRAP_DAYS: ${{ inputs.bootstrap_days || '3' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://example.pages.dev' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize with main before generation
        run: git pull --rebase origin main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Cache Argos English-Japanese model
        uses: actions/cache@v4
        with:
          path: .cache/argos
          key: argos-en-ja-${{ runner.os }}-v1

      - name: Restore feed HTTP validators
        uses: actions/cache@v4
        with:
          path: .cache/feed-state.json
          key: feed-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            feed-state-${{ runner.os }}-

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Fetch official feeds and generate digest
        run: python scripts/update_news.py

      - name: Lint and test Python
        run: |
          ruff check .
          pytest
          python scripts/validate_repository.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check and build Astro
        run: |
          npm run check
          npm run build

      - name: Verify automatic change scope
        id: changes
        shell: bash
        run: |
          git status --short
          invalid=0
          while IFS= read -r path; do
            case "$path" in
              src/content/daily/*.md|data/seen.json) ;;
              *)
                echo "::error::Unexpected generated change: $path"
                invalid=1
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)
          if [[ "$invalid" -ne 0 ]]; then
            exit 1
          fi
          git diff -- src/content/daily data/seen.json
          git add -- src/content/daily data/seen.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated content
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          digest_date="$(TZ=Asia/Tokyo date +%F)"
          git commit -m "chore(news): update daily AI digest for ${digest_date}"
          git push origin HEAD:main

      - name: Report no new content
        if: steps.changes.outputs.has_changes != 'true'
        run: echo 'No new official-feed items; no commit was created.'
