name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://ai.gaiden.news
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Lint Python
        run: ruff check .

      - name: Test Python without network feeds
        run: pytest

      - name: Validate repository content
        run: python scripts/validate_repository.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check Astro and content schema
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Validate generated RSS and sitemap
        run: npm run validate:rss
